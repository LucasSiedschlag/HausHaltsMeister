basePath: /
definitions:
  dto.BudgetItemResponse:
    properties:
      actual_amount:
        type: number
      budget_period_id:
        type: integer
      category_id:
        type: integer
      category_name:
        type: string
      id:
        type: integer
      mode:
        type: string
      planned_amount:
        type: number
      target_percent:
        type: number
    type: object
  dto.BudgetSummaryResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.BudgetItemResponse'
        type: array
      month:
        type: string
      total_income:
        type: number
    type: object
  dto.BulkBudgetItemRequest:
    properties:
      category_id:
        type: integer
      target_percent:
        type: number
    type: object
  dto.BulkBudgetItemsRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.BulkBudgetItemRequest'
        type: array
    type: object
  dto.CaseInstallmentResponse:
    properties:
      amount:
        type: number
      case_id:
        type: integer
      due_date:
        type: string
      extra_amount:
        type: number
      id:
        type: integer
      installment_number:
        type: integer
      is_paid:
        type: boolean
      paid_at:
        type: string
    type: object
  dto.CaseResponse:
    properties:
      amount_paid:
        type: number
      amount_remaining:
        type: number
      case_type:
        type: string
      category_id:
        type: integer
      id:
        type: integer
      installment_amount:
        type: number
      installment_count:
        type: integer
      installment_plan_id:
        type: integer
      installments_paid:
        type: integer
      installments_total:
        type: integer
      interest_rate:
        type: number
      interest_rate_unit:
        type: string
      payment_method_id:
        type: integer
      person_id:
        type: integer
      recurrence_interval_months:
        type: integer
      start_date:
        type: string
      status:
        type: string
      title:
        type: string
      total_amount:
        type: number
    type: object
  dto.CashFlowResponse:
    properties:
      amount:
        type: number
      category_id:
        type: integer
      date:
        type: string
      direction:
        type: string
      id:
        type: integer
      is_fixed:
        type: boolean
      title:
        type: string
    type: object
  dto.CategoryResponse:
    properties:
      direction:
        type: string
      id:
        type: integer
      inactive_from_month:
        type: string
      is_active:
        type: boolean
      is_budget_relevant:
        type: boolean
      name:
        type: string
    type: object
  dto.CategorySummaryResponse:
    properties:
      category_name:
        type: string
      direction:
        type: string
      total_amount:
        type: number
    type: object
  dto.CopyFixedRequest:
    properties:
      from_month:
        type: string
      to_month:
        type: string
    type: object
  dto.CreateCaseRequest:
    properties:
      case_type:
        type: string
      category_id:
        type: integer
      installment_amount:
        type: number
      installment_count:
        type: integer
      installment_plan_id:
        type: integer
      interest_rate:
        type: number
      interest_rate_unit:
        type: string
      payment_method_id:
        type: integer
      person_id:
        type: integer
      recurrence_interval_months:
        type: integer
      start_date:
        type: string
      title:
        type: string
      total_amount:
        type: number
    type: object
  dto.CreateCashFlowRequest:
    properties:
      amount:
        type: number
      category_id:
        type: integer
      date:
        description: YYYY-MM-DD
        type: string
      direction:
        type: string
      is_fixed:
        type: boolean
      title:
        type: string
    type: object
  dto.CreateCategoryRequest:
    properties:
      direction:
        description: IN or OUT
        type: string
      is_budget_relevant:
        type: boolean
      name:
        type: string
    type: object
  dto.CreateInstallmentRequest:
    properties:
      amount_mode:
        type: string
      category_id:
        type: integer
      count:
        type: integer
      description:
        type: string
      installment_amount:
        type: number
      payment_method_id:
        type: integer
      purchase_date:
        description: YYYY-MM-DD
        type: string
      total_amount:
        type: number
    type: object
  dto.CreateLedgerAccountRequest:
    properties:
      currency:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  dto.CreateLedgerPostingRequest:
    properties:
      account_id:
        type: integer
      amount:
        type: number
      category_id:
        type: integer
      memo:
        type: string
      party_id:
        type: integer
      side:
        type: string
    type: object
  dto.CreateLedgerTransactionRequest:
    properties:
      description:
        type: string
      notes:
        type: string
      occurred_at:
        type: string
      postings:
        items:
          $ref: '#/definitions/dto.CreateLedgerPostingRequest'
        type: array
      reference:
        type: string
    type: object
  dto.CreatePaymentMethodRequest:
    properties:
      bank_name:
        type: string
      closing_day:
        type: integer
      credit_limit:
        type: number
      due_day:
        type: integer
      kind:
        type: string
      name:
        type: string
    type: object
  dto.CreatePersonRequest:
    properties:
      name:
        type: string
      notes:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  dto.InstallmentPlanResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      installment_amount:
        type: number
      installment_count:
        type: integer
      payment_method_id:
        type: integer
      start_month:
        type: string
      total_amount:
        type: number
    type: object
  dto.InvoiceEntryResponse:
    properties:
      amount:
        type: number
      cash_flow_id:
        type: integer
      category_name:
        type: string
      date:
        type: string
      title:
        type: string
    type: object
  dto.InvoiceResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/dto.InvoiceEntryResponse'
        type: array
      month:
        type: string
      payment_method_id:
        type: integer
      total:
        type: number
      total_remaining:
        type: number
    type: object
  dto.LedgerAccountResponse:
    properties:
      currency:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      name:
        type: string
      type:
        type: string
    type: object
  dto.LedgerPostingResponse:
    properties:
      account_id:
        type: integer
      amount:
        type: number
      category_id:
        type: integer
      id:
        type: integer
      memo:
        type: string
      party_id:
        type: integer
      side:
        type: string
    type: object
  dto.LedgerTransactionResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      notes:
        type: string
      occurred_at:
        type: string
      postings:
        items:
          $ref: '#/definitions/dto.LedgerPostingResponse'
        type: array
      reference:
        type: string
    type: object
  dto.MonthlySummaryResponse:
    properties:
      balance:
        type: number
      total_expense:
        type: number
      total_income:
        type: number
    type: object
  dto.PaymentMethodResponse:
    properties:
      bank_name:
        type: string
      closing_day:
        type: integer
      credit_limit:
        type: number
      due_day:
        type: integer
      id:
        type: integer
      is_active:
        type: boolean
      kind:
        type: string
      name:
        type: string
    type: object
  dto.PersonResponse:
    properties:
      balance:
        type: number
      id:
        type: integer
      name:
        type: string
      notes:
        type: string
    type: object
  dto.SetBudgetBatchRequest:
    properties:
      category_id:
        type: integer
      end_month:
        type: string
      mode:
        type: string
      planned_amount:
        type: number
      start_month:
        type: string
      target_percent:
        type: number
    type: object
  dto.SetBudgetItemRequest:
    properties:
      category_id:
        type: integer
      mode:
        type: string
      planned_amount:
        type: number
      target_percent:
        type: number
    type: object
  dto.UpdateBudgetItemRequest:
    properties:
      mode:
        type: string
      planned_amount:
        type: number
      target_percent:
        type: number
    type: object
  dto.UpdateCaseInstallmentRequest:
    properties:
      extra_amount:
        type: number
      is_paid:
        type: boolean
    type: object
  dto.UpdateCategoryRequest:
    properties:
      direction:
        description: IN or OUT
        type: string
      is_active:
        type: boolean
      is_budget_relevant:
        type: boolean
      name:
        type: string
    type: object
  dto.UpdatePaymentMethodRequest:
    properties:
      bank_name:
        type: string
      closing_day:
        type: integer
      credit_limit:
        type: number
      due_day:
        type: integer
      is_active:
        type: boolean
      kind:
        type: string
      name:
        type: string
    type: object
  dto.UpdatePersonRequest:
    properties:
      name:
        type: string
      notes:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: Lucas Siedschlag
    url: http://www.swagger.io/support
  description: API for HausHaltsMeister (Personal Finance Management).
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: HausHaltsMeister API
  version: "1.0"
paths:
  /budgets/{month}/items:
    post:
      consumes:
      - application/json
      description: Sets or updates the budget item (percentual or absoluto) for a
        specific category in a given month.
      parameters:
      - description: Reference Month (YYYY-MM-DD)
        example: "2024-03-01"
        format: date
        in: path
        name: month
        required: true
        type: string
      - description: Budget Item Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.SetBudgetItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BudgetItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Definir Item de Orçamento
      tags:
      - Budgets
    put:
      consumes:
      - application/json
      description: Updates all budget items for a month and validates 100% distribution.
      parameters:
      - description: Reference Month (YYYY-MM-DD)
        example: "2024-03-01"
        format: date
        in: path
        name: month
        required: true
        type: string
      - description: Bulk Budget Items Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.BulkBudgetItemsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Atualizar Orçamento em Lote
      tags:
      - Budgets
  /budgets/{month}/summary:
    get:
      consumes:
      - application/json
      description: Returns the budget summary comparing planned vs actual expenses
        for the month.
      parameters:
      - description: Reference Month (YYYY-MM-DD)
        example: "2024-03-01"
        format: date
        in: path
        name: month
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BudgetSummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Visualizar Orçamento (Planned vs Actual)
      tags:
      - Budgets
  /budgets/batch:
    post:
      consumes:
      - application/json
      description: Sets the planned amount for a specific category across a range
        of months.
      parameters:
      - description: Batch Budget Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.SetBudgetBatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Definir Orçamento em Lote
      tags:
      - Budgets
  /budgets/items/{id}:
    put:
      consumes:
      - application/json
      description: Updates the budget item (percentual ou absoluto) for a specific
        budget item.
      parameters:
      - description: Budget Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Budget Item Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateBudgetItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BudgetItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Atualizar Item de Orçamento
      tags:
      - Budgets
  /cashflows:
    get:
      consumes:
      - application/json
      description: Returns a list of cash flows for the specified month.
      parameters:
      - description: Reference Month (YYYY-MM-DD)
        example: "2024-03-01"
        format: date
        in: query
        name: month
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CashFlowResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Listar Fluxos (Extrato)
      tags:
      - CashFlows
    post:
      consumes:
      - application/json
      description: Creates a new cash flow (income or expense).
      parameters:
      - description: CashFlow Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCashFlowRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CashFlowResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Criar Lançamento
      tags:
      - CashFlows
  /cashflows/category-summary:
    get:
      consumes:
      - application/json
      description: Returns a list of expenses/incomes grouped by category for the
        specified month.
      parameters:
      - description: Reference Month (YYYY-MM-DD)
        example: "2024-03-01"
        format: date
        in: query
        name: month
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CategorySummaryResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Resumo por Categoria
      tags:
      - CashFlows
  /cashflows/copy-fixed:
    post:
      consumes:
      - application/json
      description: Copies fixed expenses from a source month to a target month.
      parameters:
      - description: Copy Fixed Param
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CopyFixedRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Copiar Gastos Fixos
      tags:
      - CashFlows
  /cashflows/summary:
    get:
      consumes:
      - application/json
      description: Returns the total income, expense, and balance for the specified
        month.
      parameters:
      - description: Reference Month (YYYY-MM-DD)
        example: "2024-03-01"
        format: date
        in: query
        name: month
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MonthlySummaryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Resumo Mensal
      tags:
      - CashFlows
  /categories:
    get:
      consumes:
      - application/json
      description: Returns a list of all categories, optionally filtered by active
        status.
      parameters:
      - description: Filter only active categories
        in: query
        name: active
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.CategoryResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Listar Categorias
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Creates a new category for financial flows.
      parameters:
      - description: Category Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Create Categoria
      tags:
      - Categories
  /categories/{id}:
    put:
      consumes:
      - application/json
      description: Updates a category by ID.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Category Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Atualizar Categoria
      tags:
      - Categories
  /categories/{id}/deactivate:
    patch:
      consumes:
      - application/json
      description: Deactivates a specific category by ID.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Desativar Categoria
      tags:
      - Categories
  /installments:
    post:
      consumes:
      - application/json
      description: Creates a new purchase that is split into multiple installments.
      parameters:
      - description: Installment Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateInstallmentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.InstallmentPlanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Criar Compra Parcelada
      tags:
      - Cards
  /ledger/accounts:
    get:
      consumes:
      - application/json
      description: Returns all ledger accounts.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.LedgerAccountResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Listar Contas
      tags:
      - Ledger
    post:
      consumes:
      - application/json
      description: Creates a new ledger account.
      parameters:
      - description: Account Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateLedgerAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.LedgerAccountResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Criar Conta
      tags:
      - Ledger
  /ledger/transactions:
    get:
      consumes:
      - application/json
      description: Returns ledger transactions for a reference month.
      parameters:
      - description: Reference Month (YYYY-MM-DD)
        example: "2024-03-01"
        format: date
        in: query
        name: month
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.LedgerTransactionResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Listar Transacoes por Mes
      tags:
      - Ledger
    post:
      consumes:
      - application/json
      description: Creates a new ledger transaction with postings.
      parameters:
      - description: Transaction Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateLedgerTransactionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
