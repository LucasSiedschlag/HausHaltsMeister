version: "2"
sql:
  - schema: "migrations"
    queries:
      - "db/queries/ledger.sql"
      - "db/queries/categories.sql"
      - "db/queries/cash_flows.sql"
      - "db/queries/budgets.sql"
      - "db/queries/payments.sql"
      - "db/queries/installments.sql"
      - "db/queries/picuinhas.sql"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        out: "internal/adapters/postgres/sqlc-ledger"
        sql_package: "pgx/v5"
