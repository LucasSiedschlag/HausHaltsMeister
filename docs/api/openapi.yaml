      required: true
      schema:
        type: string
    UserId:
      in: path
      name: userId
      required: true
      schema:
        type: string
    AccountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
    CategoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
    TransactionId:
      in: path
      name: transactionId
      required: true
      schema:
        type: string
    VersionId:
      in: path
      name: versionId
      required: true
      schema:
        type: string
    LineId:
      in: path
      name: lineId
      required: true
      schema:
        type: string
    CardAccountId:
      in: path
      name: cardAccountId
      required: true
      schema:
        type: string
    PlanId:
      in: path
      name: planId
      required: true
      schema:
        type: string
    InstallmentId:
      in: path
      name: installmentId
      required: true
      schema:
