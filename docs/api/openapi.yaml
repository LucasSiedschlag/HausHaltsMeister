openapi: 3.0.3
info:
  title: HausHaltsMeister API
  version: 0.1.0
  description: Ledger-based finance API with budgeting, investments, and credit card flows.
servers:
  - url: /
tags:
  - name: Auth
    description: Authentication and sessions
  - name: Ledgers
    description: Ledger access and membership
  - name: Accounts
    description: Cash/investment accounts
  - name: Categories
    description: Income/expense classification
  - name: Journal
    description: Transactions and entries
  - name: Budget
    description: Planning, versions, and summaries
  - name: Investments
    description: Contributions, redemptions, and earnings
  - name: Cartao
    description: Credit card lifecycle and statements
  - name: Relatorios
    description: Aggregated reporting endpoints
security:
  - BearerAuth: []
paths:
  /auth/signup:
    post:
      tags: [Auth]
      security: []
      summary: Sign up
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSignUpRequest'
      responses:
        '200':
          description: Auth result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Auth result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token
      responses:
        '200':
          description: Auth result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '204':
          description: Logged out
  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/oauth/{provider}/start:
    get:
      tags: [Auth]
      security: []
      summary: Start OAuth
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        '302':
          description: Redirect
  /auth/oauth/{provider}/callback:
    get:
      tags: [Auth]
      security: []
      summary: OAuth callback
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [google, github]
        - in: query
          name: code
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
      responses:
        '302':
          description: Redirect
  /ledgers:
    get:
      tags: [Ledgers]
      summary: List ledgers
      responses:
        '200':
          description: Ledgers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerWithRole'
    post:
      tags: [Ledgers]
      summary: Create ledger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerCreateRequest'
      responses:
        '201':
          description: Ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
  /ledgers/{ledgerId}:
    get:
      tags: [Ledgers]
      summary: Get ledger
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: Ledger with role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerWithRole'
    patch:
      tags: [Ledgers]
      summary: Update ledger
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerUpdateRequest'
      responses:
        '200':
          description: Ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ledger'
    delete:
      tags: [Ledgers]
      summary: Delete ledger (soft)
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '501':
          description: Not implemented
  /ledgers/{ledgerId}/members:
    get:
      tags: [Ledgers]
      summary: List members
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerMember'
    post:
      tags: [Ledgers]
      summary: Add member
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerMemberCreateRequest'
      responses:
        '201':
          description: Member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerMember'
  /ledgers/{ledgerId}/members/{userId}:
    patch:
      tags: [Ledgers]
      summary: Update member role
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LedgerMemberUpdateRequest'
      responses:
        '200':
          description: Member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerMember'
    delete:
      tags: [Ledgers]
      summary: Remove member
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Removed
  /ledgers/{ledgerId}/accounts:
    get:
      tags: [Accounts]
      summary: List accounts
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      tags: [Accounts]
      summary: Create account
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreateRequest'
      responses:
        '201':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
  /ledgers/{ledgerId}/accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: Get account
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    patch:
      tags: [Accounts]
      summary: Update account
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
    delete:
      tags: [Accounts]
      summary: Deactivate account
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204':
          description: Deactivated
  /ledgers/{ledgerId}/categories:
    get:
      tags: [Categories]
      summary: List categories
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - in: query
          name: direction
          schema:
            type: string
            enum: [in, out]
        - in: query
          name: active
          schema:
            type: boolean
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Create category
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
  /ledgers/{ledgerId}/categories/{categoryId}:
    get:
      tags: [Categories]
      summary: Get category
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    patch:
      tags: [Categories]
      summary: Update category
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/CategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdateRequest'
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      tags: [Categories]
      summary: Deactivate category
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/CategoryId'
      responses:
        '204':
          description: Deactivated
  /ledgers/{ledgerId}/transactions:
    post:
      tags: [Journal]
      summary: Create transaction
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCreateRequest'
      responses:
        '201':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
    get:
      tags: [Journal]
      summary: List transactions
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
        - in: query
          name: account_id
          schema:
            type: string
        - in: query
          name: category_id
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: cursor_occurred_at
          schema:
            type: string
            format: date-time
        - in: query
          name: cursor_id
          schema:
            type: string
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionList'
  /ledgers/{ledgerId}/transactions/{transactionId}:
    get:
      tags: [Journal]
      summary: Get transaction
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
    patch:
      tags: [Journal]
      summary: Update transaction
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionUpdateRequest'
      responses:
        '200':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
    delete:
      tags: [Journal]
      summary: Delete transaction
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/TransactionId'
      responses:
        '204':
          description: Deleted
  /ledgers/{ledgerId}/transactions:bulk:
    post:
      tags: [Journal]
      summary: Bulk create transactions
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '202':
          description: Bulk accepted
  /ledgers/{ledgerId}/budget/plan:
    get:
      tags: [Budget]
      summary: Get budget plan
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: Budget plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetPlan'
    post:
      tags: [Budget]
      summary: Create budget plan
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPlanRequest'
      responses:
        '201':
          description: Budget plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetPlan'
    patch:
      tags: [Budget]
      summary: Update budget plan
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetPlanRequest'
      responses:
        '200':
          description: Budget plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetPlan'
    delete:
      tags: [Budget]
      summary: Delete budget plan (admin/reset)
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '204':
          description: Deleted
  /ledgers/{ledgerId}/budget/versions:
    post:
      tags: [Budget]
      summary: Create budget version
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetVersionRequest'
      responses:
        '201':
          description: Budget version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetVersionResponse'
    get:
      tags: [Budget]
      summary: List budget versions
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - in: query
          name: from
          schema:
            type: string
            format: date
        - in: query
          name: to
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Budget versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BudgetVersionResponse'
  /ledgers/{ledgerId}/budget/versions/{versionId}:
    get:
      tags: [Budget]
      summary: Get budget version
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Budget version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetVersionResponse'
    patch:
      tags: [Budget]
      summary: Update budget version (restricted)
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '501':
          description: Not implemented
    delete:
      tags: [Budget]
      summary: Delete budget version
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/VersionId'
      responses:
        '204':
          description: Deleted
  /ledgers/{ledgerId}/budget/versions/{versionId}/lines:
    post:
      tags: [Budget]
      summary: Add budget line
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/VersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineRequest'
      responses:
        '201':
          description: Budget line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLineResponse'
  /ledgers/{ledgerId}/budget/versions/{versionId}/lines/{lineId}:
    patch:
      tags: [Budget]
      summary: Update budget line
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/LineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineUpdateRequest'
      responses:
        '200':
          description: Budget line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLineResponse'
    delete:
      tags: [Budget]
      summary: Delete budget line
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/VersionId'
        - $ref: '#/components/parameters/LineId'
      responses:
        '204':
          description: Deleted
  /ledgers/{ledgerId}/budget/monthly:
    get:
      tags: [Budget]
      summary: Monthly budget summary
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - in: query
          name: month
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Monthly summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetMonthlyResponse'
  /ledgers/{ledgerId}/budget/period:
    get:
      tags: [Budget]
      summary: Period budget summary
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Period summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetPeriodResponse'
  /ledgers/{ledgerId}/investments/contributions:
    post:
      tags: [Investments]
      summary: Create contribution
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentInput'
      responses:
        '201':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
  /ledgers/{ledgerId}/investments/redemptions:
    post:
      tags: [Investments]
      summary: Create redemption
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentInput'
      responses:
        '201':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
  /ledgers/{ledgerId}/investments/earnings:
    post:
      tags: [Investments]
      summary: Create earnings
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestmentInput'
      responses:
        '201':
          description: Transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
  /ledgers/{ledgerId}/investments/summary:
    get:
      tags: [Investments]
      summary: Investments summary
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestmentsSummary'
  /card-networks:
    get:
      tags: [Cartao]
      summary: List card networks
      responses:
        '200':
          description: Networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardNetwork'
    post:
      tags: [Cartao]
      summary: Create card network
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardNetworkRequest'
      responses:
        '201':
          description: Network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardNetwork'
  /card-networks/{code}:
    patch:
      tags: [Cartao]
      summary: Update card network
      parameters:
        - $ref: '#/components/parameters/CardNetworkCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardNetworkUpdateRequest'
      responses:
        '200':
          description: Network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardNetwork'
    delete:
      tags: [Cartao]
      summary: Delete card network
      parameters:
        - $ref: '#/components/parameters/CardNetworkCode'
      responses:
        '204':
          description: Deleted
  /ledgers/{ledgerId}/credit-cards:
    get:
      tags: [Cartao]
      summary: List credit cards
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditCard'
    post:
      tags: [Cartao]
      summary: Create credit card
      parameters:
        - $ref: '#/components/parameters/LedgerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardRequest'
      responses:
        '201':
          description: Credit card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'
  /ledgers/{ledgerId}/credit-cards/{cardAccountId}:
    get:
      tags: [Cartao]
      summary: Get credit card
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/CardAccountId'
      responses:
        '200':
          description: Credit card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'
    patch:
      tags: [Cartao]
      summary: Update credit card
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/CardAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCardRequest'
      responses:
        '200':
          description: Credit card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditCard'
    delete:
      tags: [Cartao]
      summary: Delete credit card
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/CardAccountId'
      responses:
        '204':
          description: Deleted
  /ledgers/{ledgerId}/credit-cards/{cardAccountId}/plans:
    post:
      tags: [Cartao]
      summary: Create installment plan
      parameters:
        - $ref: '#/components/parameters/LedgerId'
        - $ref: '#/components/parameters/CardAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentPlanRequest'
      responses:
        '201':
          description: Installment plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentPlan'
    get:
      tags: [Cartao]
      summary: List installment plans
      parameters:
        - $ref: '#/components/parameters/LedgerId'
